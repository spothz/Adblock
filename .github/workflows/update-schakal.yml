name: Update Schakal domain rule-set

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: update-schakal-domains
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download, filter and generate domains
        run: bash scripts/update-schakal.sh

      - name: Check changes
        id: diff
        run: |
          if [ -z "$(git status --porcelain -- ruleset/schakal_ru_com.yaml)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated rule-set
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ruleset/schakal_ru_com.yaml
          git commit -m "Update Schakal domain rule-set"
          git push
